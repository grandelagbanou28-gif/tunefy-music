name: tunefy
description: "A premium music streaming experience built with Flutter."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  auto_size_text: ^3.0.0
  animations: ^2.0.11
  video_player: ^2.8.2
  

  bloc: ^8.1.3
  flutter_bloc: ^8.1.4
  get_it: ^7.6.7

  cupertino_icons: ^1.0.2

  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.1.21
  audio_service: ^0.18.18
  muzoapi: ^0.0.1
  youtube_explode_dart: ^2.3.5
  flutter_lyric: ^3.0.2
  dio: ^5.9.0
  http: ^1.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  palette_generator: ^0.3.3+7
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.3.1
  share_plus: ^10.1.4
  audio_device_detection: ^1.0.4
  permission_handler: ^11.3.1
  mobile_scanner: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21 
  web:
    generate: true
    image_path: "path/to/image.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "path/to/image.png"
    icon_size: 48 
  macos:
    generate: true
    image_path: "path/to/image.png"

  flutter_lints: ^3.0.1


flutter:


  uses-material-design: true


  assets:
    - images/
    - images/artists/
    - images/podcasts/
    - images/home/
    - images/albums/
    - images/chill/
    - images/drake mix/
    - images/upbeat/
    - images/2010/
    - assets/tracks/
    - video/

  fonts:
    - family: AM
      fonts:
        - asset: fonts/Avenir Medium.ttf

    - family: AB
      fonts:
        - asset: fonts/Avenir Next LT Pro Bold.otf
