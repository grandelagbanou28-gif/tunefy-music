name: Sync Music Data

on:
  schedule:
    - cron: '0 */2 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync-orchestrator
        run: |
          curl -X POST https://uwjpkenrldtexlciaqdz.supabase.co/functions/v1/sync-orchestrator \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --max-time 300

  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger dedup-cleanup
        run: |
          curl -X POST https://uwjpkenrldtexlciaqdz.supabase.co/functions/v1/dedup-cleanup \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            --max-time 300
